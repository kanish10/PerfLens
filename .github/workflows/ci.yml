name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install PerfLens (dev + dashboard extras)
        run: pip install -e ".[dev,dashboard]"

      - name: Ruff (lint)
        run: ruff check perflens tests

      - name: Mypy (type check)
        run: mypy perflens

      - name: Pytest
        run: pytest -q --cov=perflens --cov-report=term-missing

      - name: perflens --help smoke test
        run: perflens --help
