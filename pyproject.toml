[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perflens"
version = "0.1.0"
description = "Nightly CI system that catches and explains CUDA kernel performance regressions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kanish Khanna" }]
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "httpx>=0.27",
]

[project.scripts]
perflens = "perflens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["perflens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is Depends(...) as an argument default.
"perflens/dashboard/api.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
